[project]
name = "multimodal-rag"
version = "0.1.0"
description = "Multimodal RAG over text and images (FastAPI, offline)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "httpx==0.28.1",
  "pillow==11.1.0",
  "python-multipart==0.0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: integration tests (offline, TestClient)",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
